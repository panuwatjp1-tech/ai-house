<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI House คลังผลงาน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&display=swap">
<style>
:root{--bg:#14131f;--card:#1f1d2e;--line:#2e2b44;--txt:#f3f1ff;--mut:#a9a4c7;--y:#ffd23f;--g:#4fd67a;--r:#ff5a5f;--b:#6fb6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Kanit,sans-serif;font-size:16px;line-height:1.5}
header{padding:20px 18px 8px}h1{margin:0;font-size:24px}header p{margin:2px 0 0;color:var(--mut);font-size:14px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;position:sticky;top:0;background:var(--bg);z-index:2}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:14px;padding:6px 14px;border-radius:999px}
nav button.on{background:var(--y);color:#1b1b1b;border-color:var(--y);font-weight:700}
main{padding:6px 18px 40px;max-width:720px;margin:0 auto}
.sec{margin:18px 0 8px;font-size:15px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:17px}.meta{font-size:13px;color:var(--mut)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;margin-right:6px}
.review{background:var(--y);color:#1b1b1b}.done{background:var(--g);color:#0d2a17}.wip{background:var(--b);color:#0b1d33}
video{width:100%;border-radius:12px;margin-top:10px;background:#000;max-height:70vh}
.note{font-size:14px;margin-top:6px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.todo:first-child{border-top:0}
.who{flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px}.owner{background:var(--r)}.house{background:#3b3760}
.empty{color:var(--mut);text-align:center;padding:30px 0}
.dept{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dept div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.dept b{display:block}.dept span{font-size:13px;color:var(--mut)}
.doc{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:15px;overflow-x:auto}
.doc h1{font-size:19px}.doc h2{font-size:17px;color:var(--y);margin:16px 0 6px}.doc h3{font-size:16px}
.doc table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}.doc td,.doc th{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}.doc th{background:#2a2740}
.doc pre{background:#0e0d17;padding:10px;border-radius:10px;white-space:pre-wrap;font-size:13px}.doc blockquote{margin:8px 0;padding:6px 12px;border-left:4px solid var(--y);color:var(--mut)}
.doc ul,.doc ol{padding-left:22px;margin:6px 0}.doc hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.btn{margin-top:10px;width:100%;border:1px solid var(--line);background:#2a2740;color:var(--txt);font:inherit;font-size:15px;padding:9px;border-radius:12px}
.copy{background:var(--y);color:#1b1b1b;font-weight:700;border:0}
.house{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 10px 30px #0006}
.room{cursor:pointer}.room:active{opacity:.85}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-2px)}}
.type{animation:ty .35s ease-in-out infinite alternate}.type2{animation:ty .35s ease-in-out infinite alternate-reverse}@keyframes ty{to{transform:translateY(2.5px)}}
.glow{animation:gl 2.4s ease-in-out infinite}@keyframes gl{50%{opacity:.75}}
.pop{animation:pp 3s ease-in-out infinite}@keyframes pp{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.float{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translate(330px,122px)}}
.wave{transform-box:fill-box;transform-origin:50% 100%;animation:wv .6s ease-in-out infinite alternate}@keyframes wv{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.tw{animation:tw 2s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.bob,.type,.type2,.glow,.pop,.float,.wave,.tw{animation:none}}
.prog{display:flex;align-items:center;gap:14px}.ring{flex:none}
.bar{height:8px;background:#2e2b44;border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#4fd67a)}
.ph{font-size:14px;margin-top:10px}.ph span{float:right;color:var(--mut)}
.brand{display:inline-block;background:#e6242b;color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:6px;vertical-align:middle}
.office{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 10px 30px #0008}
.scr{animation:sc 2.2s linear infinite}@keyframes sc{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
.zz{animation:zz 2.5s ease-in-out infinite}@keyframes zz{50%{transform:translateY(-4px);opacity:.3}}
.ping{animation:pg 1.4s ease-in-out infinite}@keyframes pg{50%{opacity:.35}}
.bell{transform-box:fill-box;transform-origin:50% 0;animation:rg 1.8s ease-in-out infinite}@keyframes rg{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(14deg)}80%{transform:rotate(-14deg)}90%{transform:rotate(8deg)}}
.win{animation:tw 3s ease-in-out infinite}
.inb b{display:block;margin:2px 0}.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;border:0;border-radius:12px;padding:10px;font:inherit;font-weight:700;background:var(--g);color:#0d2a17}.acts button+button{background:#2a2740;color:var(--txt);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.scr,.zz,.ping,.bell,.win{animation:none}}
</style></head>
<body>
<header><h1>🏠 AI House <span class="brand">ภนว | AI Guide</span></h1><p>คลังผลงานของบ้าน AI • <span id="upd"></span></p></header>
<nav id="tabs"></nav>
<main id="main"></main>
<script src="house.js"></script>
<script src="office.js"></script>
<script>
const FALLBACK=/*CATALOG*/null;
const DEPT={all:'🏢 ออฟฟิศ',inbox:'📥 รออนุมัติ',video:'คลิป',affiliate:'แอฟฟิลิเอต',safety:'ความปลอดภัย',teaching:'สอน AI',personal:'ผู้ช่วยส่วนตัว'};
const ST={review:['รอคุณดู','review'],done:['เสร็จแล้ว','done'],wip:['กำลังทำ','wip']};
let C, S={}, tab='all', view='office';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function inl(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function md(src){
  const L=src.split('\n');let h='',i=0;
  while(i<L.length){let l=L[i];
    if(/^```/.test(l)){let b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;h+='<pre>'+esc(b.join('\n'))+'</pre>';continue;}
    if(/^\|/.test(l)){let rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(L[i++]);
      rows=rows.filter(r=>!/^\|[\s\-|:]+\|$/.test(r)).map(r=>r.replace(/^\||\|$/g,'').split('|'));
      h+='<table>'+rows.map((r,k)=>'<tr>'+r.map(c=>k?`<td>${inl(c.trim())}</td>`:`<th>${inl(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';continue;}
    if(/^\s*[-*] /.test(l)){let it=[];while(i<L.length&&/^\s*[-*] /.test(L[i]))it.push(L[i++].replace(/^\s*[-*] /,''));h+='<ul>'+it.map(x=>`<li>${inl(x)}</li>`).join('')+'</ul>';continue;}
    if(/^\d+\. /.test(l)){let it=[];while(i<L.length&&/^\d+\. /.test(L[i]))it.push(L[i++].replace(/^\d+\. /,''));h+='<ol>'+it.map(x=>`<li>${inl(x)}</li>`).join('')+'</ol>';continue;}
    let m=l.match(/^(#{1,3}) (.*)/);if(m){h+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;i++;continue;}
    if(/^> /.test(l)){h+=`<blockquote>${inl(l.slice(2))}</blockquote>`;i++;continue;}
    if(/^---+$/.test(l.trim())){h+='<hr>';i++;continue;}
    if(l.trim())h+=`<p>${inl(l)}</p>`;i++;}
  return h;}
const DOCS={};
async function openDoc(id,file){const box=document.getElementById('d-'+id);
  if(box.innerHTML){box.innerHTML='';return;}
  try{if(!DOCS[file]){const r=await fetch(file);if(!r.ok)throw 0;DOCS[file]=await r.text();}
    box.innerHTML=md(DOCS[file])+`<button class="btn copy" onclick="copyDoc('${file}',this)">คัดลอกข้อความทั้งหมด</button>`;}
  catch(e){box.innerHTML='<p>เปิดเอกสารไม่ได้</p>';}}
function copyDoc(file,b){navigator.clipboard.writeText(DOCS[file]).then(()=>b.textContent='คัดลอกแล้ว ✓').catch(()=>b.textContent='คัดลอกไม่ได้ กดค้างที่ข้อความเพื่อคัดลอก');}
function tabs(){document.getElementById('tabs').innerHTML=Object.entries(DEPT).map(([k,v])=>`<button class="${k===tab?'on':''}" data-k="${k}">${v}</button>`).join('');
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;try{localStorage.setItem('tab',tab)}catch(e){}draw();});}
function draw(){
  tabs(); const m=document.getElementById('main');
  const items=C.items.filter(i=>tab==='all'||i.dept===tab);
  let h='';
  if(tab==='all'){
    h+=(view==='office'?officeSVG(C,S):houseSVG(C))+`<div class="meta" style="text-align:center;margin-top:6px">แตะห้องเพื่อดูงานของแผนกนั้น · <a href="#" onclick="view=view==='office'?'house':'office';draw();return false" style="color:var(--y)">${view==='office'?'ดูแบบบ้าน':'ดูแบบออฟฟิศ'}</a></div>`;
    const P=PHASES, pct=Math.round(P.reduce((a,p)=>a+p[1],0)/P.length), R=34, L=2*Math.PI*R;
    h+=`<div class="sec">ความคืบหน้าทั้งบ้าน</div><div class="card"><div class="prog"><svg class="ring" width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${R}" stroke="#2e2b44" stroke-width="9" fill="none"/><circle cx="42" cy="42" r="${R}" stroke="#ffd23f" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${L*pct/100} ${L}" transform="rotate(-90 42 42)"/><text x="42" y="49" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" font-family="Kanit">${pct}%</text></svg><div><b>บ้านเสร็จแล้ว ${pct}%</b><div class="meta">ที่เหลือ: แจ้งเตือน LINE และผลขายจากคลิปจริง</div></div></div>
      ${P.map(p=>`<div class="ph">${esc(p[0])}<span>${p[1]}%</span><div class="bar"><i style="width:${p[1]}%"></i></div></div>`).join('')}</div>`;
    h+=`<div class="sec">ขั้นต่อไป</div><div class="card">${C.next.map(n=>`<div class="todo"><span class="who ${n.who}">${n.who==='owner'?'คุณทำ':'บ้านทำ'}</span><span>${esc(n.text)}</span></div>`).join('')}</div>`;
  }
  if(tab==='inbox'){m.innerHTML=`<div class="sec">งานที่รอคุณตรวจ กดแล้วข้อความจะถูกคัดลอกไปวางในแชต Claude</div>`+inboxHTML(C);return;}
  h+=`<div class="sec">ผลงาน</div>`;
  h+=items.length?items.map(i=>{const s=ST[i.status]||ST.done;
    return `<div class="card"><span class="badge ${s[1]}">${s[0]}</span><span class="meta">${esc(i.series||DEPT[i.dept])} • ${esc(i.date)}${i.length?' • '+esc(i.length):''}</span>
    <h3>${esc(i.title)}</h3>${i.note?`<div class="note">${esc(i.note)}</div>`:''}
    ${i.file&&/\.mp4$/i.test(i.file)?`<video controls playsinline preload="metadata" src="${esc(i.file)}"></video>`:''}${i.file&&/\.md$/i.test(i.file)?`<button class="btn" onclick="openDoc('${esc(i.id)}','${esc(i.file)}')">เปิด / ปิดเอกสาร</button><div class="doc" id="d-${esc(i.id)}"></div>`:''}</div>`}).join(''):`<div class="empty">ยังไม่มีผลงานในแผนกนี้</div>`;
  m.innerHTML=h;
  document.querySelectorAll('.room').forEach(r=>r.onclick=()=>{const k=r.dataset.k;if(k==='head')return;tab=k;try{localStorage.setItem('tab',tab)}catch(e){}draw();window.scrollTo(0,0);});
}
function start(c){C=c;fetch('status.json?'+Date.now()).then(r=>r.ok?r.json():{}).then(j=>{S=j;draw();}).catch(()=>{});document.getElementById('upd').textContent='อัปเดต '+c.updated;try{tab=localStorage.getItem('tab')||'all'}catch(e){}draw();}
fetch('catalog.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(start).catch(()=>FALLBACK?start(FALLBACK):document.getElementById('main').innerHTML='<div class="empty">โหลดรายการไม่ได้</div>');
</script>
</body></html>
