name: CSR7 Cloud Source Checks
on:
  push:
    branches: [csr7-production]
  pull_request:
    branches: [csr7-production]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
