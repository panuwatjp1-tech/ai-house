<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:K;src:url(../fonts/Kanit-Bold.ttf);font-weight:700}
@font-face{font-family:K;src:url(../fonts/Kanit-Black.ttf);font-weight:900}
@font-face{font-family:K;src:url(../fonts/Kanit-SemiBold.ttf);font-weight:600}
@font-face{font-family:K;src:url(../fonts/Kanit-Medium.ttf);font-weight:500}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
svg{display:block;font-family:K} text{font-family:K}
</style></head>
<body>
<svg id="v" width="540" height="960" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../lib.js"></script>
<script>
window.EXTRA_DEFS=`<defs>
<linearGradient id="fwall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd9de"/><stop offset="1" stop-color="#e6ecef"/></linearGradient>
<filter id="gray"><feColorMatrix type="matrix" values=".33 .33 .33 0 .02  .33 .33 .33 0 .05  .33 .33 .33 0 .12  0 0 0 1 0"/></filter>
<linearGradient id="lampB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>`;
const CHIP0='สอนงานไลน์ผลิต';
const JAMX=250;

// ---------- location ----------
// o: belt (0 stopped..1 running), jam (0..1 pile), alarm, guard ('on'|'off'|lerp 0..1 position), oldWI/newWI, lock, tagOn, stopped
function lineBg(t,o={}){
  const run=o.run!=null?o.run:1, jam=o.jam||0, g=o.guard!=null?o.guard:1;
  let s=`<rect width="540" height="960" fill="url(#fwall)"/>`;
  // ceiling
  s+=`<rect x="0" y="0" width="540" height="240" fill="#b7c3ca"/>`;
  for(let x=0;x<540;x+=90) s+=`<rect x="${x}" y="0" width="6" height="240" fill="#9aa8b0"/>`;
  [110,270,430].forEach(x=>s+=`<rect x="${x-50}" y="226" width="100" height="10" rx="4" fill="#f4f7f8"/><path d="M${x-50} 236 L${x+50} 236 L${x+130} 700 L${x-130} 700 Z" fill="url(#lampB)" opacity=".6"/>`);
  // windows
  for(let i=0;i<4;i++) s+=`<rect x="${30+i*130}" y="270" width="100" height="60" rx="4" fill="#bfe6fb" stroke="#8fa3ad" stroke-width="3"/><line x1="${80+i*130}" y1="270" x2="${80+i*130}" y2="330" stroke="#8fa3ad" stroke-width="3"/>`;
  // lower wall band + safety sign
  s+=`<rect x="0" y="520" width="540" height="180" fill="#2f6e9e"/><rect x="0" y="516" width="540" height="6" fill="#ffd23f"/>`;
  s+=`<g transform="translate(100 420)"><rect x="-38" y="-34" width="76" height="68" rx="6" fill="#1fb35a"/><text y="-6" text-anchor="middle" font-size="15" font-weight="900" fill="#fff">SAFETY</text><text y="16" text-anchor="middle" font-size="15" font-weight="900" fill="#fff">FIRST</text></g>`;
  // WI board on wall near machine
  if(!o.noWI){
    if(o.newWI){ s+=`<g transform="translate(300 400)"><rect x="-44" y="-58" width="88" height="116" rx="4" fill="#fff" stroke="#1f5aa6" stroke-width="4"/><rect x="-44" y="-58" width="88" height="20" fill="#1f5aa6"/><text y="-43" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">WI ใหม่</text>
       ${[0,1,2,3].map(i=>`<rect x="-36" y="${-32+i*22}" width="16" height="16" rx="2" fill="#bfe3f7"/><text x="-28" y="${-20+i*22}" text-anchor="middle" font-size="11" font-weight="900" fill="#1f5aa6">${i+1}</text><rect x="-14" y="${-28+i*22}" width="48" height="7" fill="#556"/>`).join('')}</g>`;}
    else { s+=`<g transform="translate(300 ${o.wiLow?470:400})" opacity=".9"><rect x="-34" y="-44" width="68" height="88" fill="#e9e2c8" stroke="#b9ae86" stroke-width="2"/>
       ${[0,1,2,3,4,5,6,7].map(i=>`<rect x="-26" y="${-34+i*9}" width="${40+rnd(i)*12}" height="3" fill="#b8b09a"/>`).join('')}<rect x="-34" y="-44" width="68" height="88" fill="#8a7a50" opacity=".15"/>
       <text y="38" text-anchor="middle" font-size="9" font-weight="700" fill="#a39770">WI</text></g>`;}
  }
  // removed guard leaning on wall
  const gx=lerp(40,230,g), gy=lerp(660,598,g), gr=lerp(-70,0,g);
  // conveyor frame
  s+=`<g><rect x="40" y="606" width="300" height="20" rx="8" fill="#3a3f48"/>`;
  for(let x=48;x<340;x+=24){const a=t*run*8+x; s+=`<circle cx="${x}" cy="616" r="8" fill="#6d7480" stroke="#2a2e35" stroke-width="2"/><line x1="${x}" y1="616" x2="${x+Math.cos(a)*7}" y2="${616+Math.sin(a)*7}" stroke="#2a2e35" stroke-width="2"/>`;}
  s+=`<rect x="40" y="600" width="300" height="8" fill="#22262c"/>`;
  [60,190,320].forEach(x=>s+=`<rect x="${x}" y="626" width="12" height="74" fill="#555c66"/>`);
  s+=`</g>`;
  // boxes
  const sp=70*run;
  for(let i=0;i<6;i++){
    let x=((o.tb!=null?o.tb:t)*sp+i*70)%340+20;
    if(jam>0 && x>JAMX-40) x=Math.min(x,JAMX-20-(5-i)*0) ;
    if(o.boxesFrozen!=null) x=o.boxesFrozen[i];
    if(x<40||x>330) continue;
    s+=`<g transform="translate(${x} 600)"><rect x="-18" y="-30" width="36" height="30" fill="#c8955a" stroke="#8a6030" stroke-width="2"/><rect x="-4" y="-30" width="8" height="30" fill="#e8d3a8" opacity=".8"/></g>`;
  }
  if(jam>0){ // pile at jam point
    s+=`<g>${[[JAMX-12,600,-8],[JAMX+18,596,14],[JAMX+2,572,-20]].map(([x,y,r],i)=>`<g transform="translate(${x} ${y}) rotate(${r*jam})" opacity="${i<2||jam>.5?1:0}"><rect x="-18" y="-30" width="36" height="30" fill="#c8955a" stroke="#8a6030" stroke-width="2"/><rect x="-4" y="-30" width="8" height="30" fill="#e8d3a8" opacity=".8"/></g>`).join('')}</g>`;
  }
  // guard (mesh)
  s+=`<g transform="translate(${gx} ${gy}) rotate(${gr})"><rect x="-50" y="-14" width="100" height="24" rx="4" fill="#ffd23f" fill-opacity=".85" stroke="#b8860b" stroke-width="2"/>
     ${[...Array(9)].map((_,i)=>`<line x1="${-46+i*11}" y1="-12" x2="${-46+i*11}" y2="8" stroke="#b8860b" stroke-width="1.5"/>`).join('')}</g>`;
  // packing machine + panel
  s+=`<g transform="translate(${-70+(o.shake?Math.sin(t*70)*2.5:0)} ${o.shake?Math.cos(t*55)*1.5:0})"><rect x="400" y="500" width="130" height="200" rx="6" fill="#e3e8ec" stroke="#8a96a0" stroke-width="3"/><rect x="410" y="516" width="70" height="60" rx="4" fill="#2a3440"/><rect x="416" y="522" width="58" height="34" fill="${run>0?'#4ad18a':'#334'}" opacity=".8"/>
    <rect x="488" y="516" width="34" height="96" rx="4" fill="#cdd5dc" stroke="#8a96a0"/>
    <circle cx="505" cy="536" r="9" fill="#1fb35a" stroke="#0d5a2c" stroke-width="2"/>
    <circle cx="505" cy="566" r="12" fill="#e6242b" stroke="#7a0c10" stroke-width="3"/><circle cx="505" cy="566" r="6" fill="#ff5a5f"/>
    <rect x="496" y="586" width="18" height="18" rx="3" fill="#ffd23f" stroke="#8a6200"/>`;
  if(o.lock) s+=`<g transform="translate(505 ${614})"><path d="M-6 0 v-8 a6 6 0 0 1 12 0 v8" stroke="#555" stroke-width="3" fill="none"/><rect x="-9" y="0" width="18" height="16" rx="3" fill="#e6242b"/></g>`;
  if(o.tagOn) s+=`<g transform="translate(470 650) rotate(${Math.sin(t*3)*3})"><line x1="35" y1="-20" x2="20" y2="-8" stroke="#555"/><rect x="-28" y="-8" width="56" height="40" rx="4" fill="#e6242b" stroke="#7a0c10"/><text y="9" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">อันตราย</text><text y="24" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">ห้ามเปิด</text></g>`;
  // stack light
  const al=o.alarm&&Math.sin(t*14)>0;
  s+=`<rect x="460" y="420" width="8" height="80" fill="#555"/>`;
  ['#e6242b','#ffd23f','#1fb35a'].forEach((c,i)=>{const on=(i==0&&al)||(i==2&&run>0&&!o.alarm);s+=`<rect x="452" y="${430+i*20}" width="24" height="18" rx="4" fill="${c}" opacity="${on?1:.3}"/>${on?`<circle cx="464" cy="${439+i*20}" r="22" fill="${c}" opacity=".3" filter="url(#blur4)"/>`:''}`;});
  s+=`</g>`;
  // floor
  s+=`<rect x="0" y="700" width="540" height="260" fill="#5f9e7a"/><rect x="0" y="700" width="540" height="6" fill="#4f8a68"/>
     <path d="M0 780 H540" stroke="#ffd23f" stroke-width="8"/><path d="M0 800 H540" stroke="#ffd23f" stroke-width="3" stroke-dasharray="16 10"/>`;
  return s;
}
const OP={shirt:'#5aa0d8',pants:'#2d3b6b',skin:'#e2ad7c',hat:'cap',capCol:'#1f5aa6',badge:'#1f5aa6',boots:true};
const op=o=>person(Object.assign({},OP,o));
const SUP={shirt:'#f4f6f8',pants:'#3a3f4d',skin:'#f2c79c',hair:'#2b2b2b',badge:'#e6242b',boots:true,glasses:true,plugs:true};
const sup=o=>person(Object.assign({},SUP,o));
function stepPanel(t,steps,doneTimes,showT,title='WI ทีละขั้น'){
  const uo=prog(t,showT,showT+.3); if(uo<=0) return '';
  let s=`<g transform="translate(14 400)" filter="url(#shadow)" opacity="${uo}"><rect width="200" height="${44+steps.length*48}" rx="12" fill="#fff" stroke="#1b1b1b" stroke-width="3"/><rect width="200" height="34" rx="12" fill="#1f5aa6"/><text x="100" y="24" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">${title}</text></g>`;
  steps.forEach((st,i)=>{const on=t>=doneTimes[i];const act=t>=doneTimes[i]-1.2&&!on;
    s+=`<g transform="translate(40 ${466+i*48})" opacity="${uo}"><rect x="-14" y="-14" width="28" height="28" rx="6" fill="${on?'#1fb35a':(act?'#ffd23f':'#ddd')}"/>${on?'<path d="M-7 0 L-2 6 L8 -6" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>':`<text y="6" text-anchor="middle" font-size="15" font-weight="900" fill="#555">${i+1}</text>`}
      <text x="22" y="-1" font-size="15" font-weight="700" fill="#1b1b1b">${st[0]}</text><text x="22" y="16" font-size="13" font-weight="500" fill="#555">${st[1]}</text></g>`;});
  return s;
}
function scan(t){let s='';for(let y=0;y<960;y+=6) s+=`<rect x="0" y="${y}" width="540" height="2" fill="#000" opacity=".18"/>`;
  for(let i=0;i<3;i++){const y=(t*700+i*320)%960;s+=`<rect x="${Math.sin(t*30+i)*8}" y="${y}" width="540" height="16" fill="#fff" opacity=".12"/>`;}return s;}
function rewindIcon(x,y,sc=1){return `<g transform="translate(${x} ${y}) scale(${sc})"><path d="M0 -18 L-26 0 L0 18 Z M28 -18 L2 0 L28 18 Z" fill="#fff" stroke="#1b1b1b" stroke-width="3"/></g>`;}


function andonCord(t,pull=0){
  let s=`<line x1="40" y1="470" x2="350" y2="470" stroke="#ffd23f" stroke-width="3"/>`;
  for(let x=40;x<=350;x+=62) s+=`<rect x="${x-3}" y="464" width="6" height="12" fill="#555"/>`;
  const hy=520+pull*26;
  s+=`<line x1="150" y1="470" x2="150" y2="${hy}" stroke="#ffd23f" stroke-width="3"/><rect x="141" y="${hy}" width="18" height="26" rx="5" fill="#e6242b" stroke="#7a0c10" stroke-width="2"/>`;
  s+=`<text x="150" y="458" text-anchor="middle" font-size="11" font-weight="900" fill="#b8860b">สายแอนดอน</text>`;
  return s;
}
function smoke(x,y,t,op=1){let s='';for(let i=0;i<5;i++){const a=((t*.8+i/5)%1);s+=`<circle cx="${x+Math.sin(t*2+i)*10+a*20}" cy="${y-a*90}" r="${8+a*18}" fill="#9aa3ad" opacity="${op*(.5-a*.5)}"/>`;}return s;}
function handIcon(x,y,sc,t){return `<g transform="translate(${x} ${y}) scale(${sc})"><rect x="-26" y="-14" width="52" height="52" rx="22" fill="#f4c79a" stroke="#1b1b1b" stroke-width="3"/>
 ${[-20,-7,6,19].map((fx,i)=>`<rect x="${fx-6}" y="${-50+(i==0||i==3?8:0)}" width="12" height="44" rx="6" fill="#f4c79a" stroke="#1b1b1b" stroke-width="3"/>`).join('')}<rect x="-28" y="-14" width="56" height="20" fill="#f4c79a"/>
 <rect x="20" y="0" width="12" height="28" rx="6" transform="rotate(-35 26 14)" fill="#f4c79a" stroke="#1b1b1b" stroke-width="3"/></g>`;}
function megaIcon(x,y,sc){return `<g transform="translate(${x} ${y}) scale(${sc})"><path d="M-30 -12 h14 l34 -22 v68 l-34 -22 h-14 z" fill="#ffd23f" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round"/><rect x="-26" y="12" width="12" height="20" rx="3" fill="#ffd23f" stroke="#1b1b1b" stroke-width="3"/>
 <path d="M26 -14 q12 14 0 28 M34 -24 q22 24 0 48" stroke="#1b1b1b" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;}
function glassIcon(x,y,sc,t){const f=(t*.4)%1;return `<g transform="translate(${x} ${y}) scale(${sc}) rotate(${f>.85?(f-.85)/.15*180:0})"><rect x="-26" y="-40" width="52" height="8" rx="3" fill="#8a5a2a"/><rect x="-26" y="32" width="52" height="8" rx="3" fill="#8a5a2a"/>
 <path d="M-20 -32 h40 q0 22 -20 32 q20 10 20 32 h-40 q0 -22 20 -32 q-20 -10 -20 -32 z" fill="#d8f1ff" stroke="#1b1b1b" stroke-width="3"/>
 <path d="M-14 ${-26+f*20} h28 q-4 ${12-f*8} -14 ${20-f*14} q-10 ${-8+f*6} -14 ${-20+f*14} z" fill="#ffcf33"/><path d="M-12 30 q12 ${-12*f} 24 0 z" fill="#ffcf33"/></g>`;}
const SCW=[['หยุด','กดหยุดเครื่อง'],['เรียก','แอนดอน / ยกมือ'],['รอ','อย่าแก้เอง อย่าเดินหนี']];
function scwPanel(t,times,show){
  const uo=prog(t,show,show+.3); if(uo<=0) return '';
  const icons=[(x,y,s)=>handIcon(x,y,s,t),(x,y,s)=>megaIcon(x,y,s),(x,y,s)=>glassIcon(x,y,s,t)];
  let s=`<g opacity="${uo}">`;
  SCW.forEach((st,i)=>{const on=t>=times[i]; const p=on?back(prog(t,times[i],times[i]+.3)):1;
    s+=`<g transform="translate(${95+i*175} 780)"><g transform="scale(${on?p:.85})"><circle r="52" fill="${on?['#e6242b','#ffb020','#1fb35a'][i]:'#ffffff'}" opacity="${on?1:.85}" stroke="#1b1b1b" stroke-width="3"/>${icons[i](0,on?-4:-4,.62)}</g>
      <text y="76" text-anchor="middle" font-size="24" font-weight="900" fill="${on?'#fff':'#ccd'}" paint-order="stroke" stroke="#1b1b1b" stroke-width="5">${i+1}. ${st[0]}</text></g>`;});
  return s+`</g>`;
}
const NEWB={shirt:'#5aa0d8',pants:'#2d3b6b',skin:'#f2c094',hat:'cap',capCol:'#1fb35a',badge:'#1fb35a',boots:true,glasses:true,plugs:true};
const nb=o=>person(Object.assign({},NEWB,o));
const LEAD=Object.assign({},SUP,{shirt:'#2b6cc4',hat:'cap',capCol:'#e6242b',hair:'#2b2b2b',badge:'#ffd23f'});
const lead=o=>person(Object.assign({},LEAD,o));
function screwdriver(x,y,r){return `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-4" y="-34" width="8" height="22" rx="3" fill="#e6242b"/><rect x="-1.5" y="-12" width="3" height="26" fill="#bbb"/></g>`;}

// ---------- scenes ----------
SC[1]=(t,d)=>{
  let s=lineBg(t,{guard:1,shake:t>.6})+andonCord(t);
  if(t>.6) s+=smoke(400,500,t,prog(t,.6,1.4));
  s+=nb({x:250,eyes:t>1.2?'wide':'normal',mouth:t>1.2?'o':'smile',armR:-20});
  s+=burst(400,420,'แกร๊ก แกร๊ก!',t-.7,{fs:30,sc:.75,rot:8});
  return s+'<!--UI-->'+titleCard(['ระหว่างทำงาน...','เครื่องส่ง*เสียงแปลก ๆ!*'],t)+topUI(CHIP0);
};
SC[2]=(t,d)=>{
  let s=lineBg(t,{guard:1,shake:true})+andonCord(t)+smoke(400,500,t,.8);
  const r=prog(t,.4,1.4);
  s+=nb({x:lerp(250,300,r),eyes:'lazy',mouth:'smirk',armL:lerp(20,-60,r),armR:-20});
  s+=screwdriver(lerp(222,262,r),lerp(650,570,r),lerp(0,60,r));
  s+=bubble(250,400,['แค่นี้*แก้เอง*ได้','ไม่ต้องบอกใคร~'],t-1.0);
  return s+'<!--UI-->'+titleCard(['"เดี๋ยว*แก้เอง*"'],t,34)+topUI('ข้ออ้าง');
};
function frz(t){return `<g filter="url(#gray)">`+lineBg(0,{guard:1})+andonCord(0)+smoke(400,500,.3,.8)+nb({x:300,eyes:'lazy',mouth:'smirk',armL:-60})+screwdriver(262,570,60)+`</g>`;}
SC[3]=(t,d)=>{
  let s=t<.25?lineBg(t,{guard:1,shake:true})+andonCord(t)+nb({x:300,armL:-60}):frz(t);
  s+=ghost(lerp(-40,110,easeOut(prog(t,1.6,2.8))),700,prog(t,1.6,2.4),t,{armR:-60,eyes:'normal',mouth:'flat'});
  s+='<!--UI-->';
  if(t>.25) s+=`<rect width="540" height="960" fill="#fff" opacity="${clamp(1-(t-.25)/.15)*.8}"/>`;
  s+=burst(270,300,'หยุด!!',t-.25,{fs:56,col:'#2b4cff',fill:'#fff',rot:-6});
  return s+titleCard(['*ทุกอย่างหยุดนิ่ง...*'],t,32)+topUI('หยุด!!');
};
const T4={press:1.3}, T5={pull:2.1,hand:3.5}, T6={wait:.3};
SC[4]=(t,d)=>{
  const stopped=t>T4.press;
  let s=lineBg(t,{guard:1,shake:!stopped,run:stopped?Math.max(0,1-prog(t,T4.press,T4.press+.6)):1})+andonCord(t);
  if(!stopped) s+=smoke(400,500,t,.7); else s+=smoke(400,500,t,.7*(1-prog(t,T4.press,T4.press+1.2)));
  s+=nb({x:330,flip:-1,armL:t>T4.press-.5?lerp(20,95,prog(t,T4.press-.5,T4.press)):20,eyes:'normal',mouth:'flat'});
  s+=ghost(80,700,.85,t,{armR:-120,eyes:'normal',mouth:'smile'});
  if(stopped) s+=sparkles(435,566,t-T4.press,8,30);
  return s+'<!--UI-->'+scwPanel(t,[T4.press,99,99],.2)+titleCard(['1. *หยุด*','กดหยุดเครื่องทันที'],t)+topUI('1/3 หยุด');
};
SC[5]=(t,d)=>{
  let s=lineBg(t,{guard:1,run:0})+andonCord(t,t>T5.pull?Math.max(0,1-prog(t,T5.pull+.4,T5.pull+.8)):prog(t,T5.pull-.4,T5.pull));
  const al=t>T5.pull;
  // yellow andon light on stack (overlay)
  if(al) s+=`<g transform="translate(-70 0)"><rect x="452" y="450" width="24" height="18" rx="4" fill="#ffd23f" opacity="${Math.sin(t*10)>0?1:.4}"/><circle cx="464" cy="459" r="24" fill="#ffd23f" opacity=".4" filter="url(#blur4)"/></g>`;
  const x=lerp(330,175,easeOut(prog(t,.6,1.6)));
  const pulling=t>T5.pull-.4&&t<T5.pull+.8, hand=t>T5.hand;
  s+=nb({x,flip:x<300?1:-1,walk:t*1.5,walkAmt:t>.6&&t<1.6?1:0,armR:pulling?-175:(hand?-170:-20),armL:hand?20:20,eyes:'normal',mouth:hand?'o':'flat'});
  if(al) s+=burst(380,390,'ติ๊งต่อง~',t-T5.pull,{fs:30,fill:'#fff3a0',col:'#b8860b',sc:.7,rot:8});
  if(hand) s+=burst(170,330,'หัวหน้าครับ!',t-T5.hand,{fs:28,sc:.7,rot:-6,col:'#1f5aa6'});
  return s+'<!--UI-->'+scwPanel(t,[0,T5.pull,99],0)+titleCard(['2. *เรียก*','ดึงสายแอนดอน / ยกมือ'],t)+topUI('2/3 เรียก');
};
SC[6]=(t,d)=>{
  let s=lineBg(t,{guard:1,run:0})+andonCord(t);
  s+=`<g transform="translate(-70 0)"><rect x="452" y="450" width="24" height="18" rx="4" fill="#ffd23f" opacity="${Math.sin(t*10)>0?1:.4}"/></g>`;
  s+=nb({x:300,flip:-1,eyes:'normal',mouth:'flat',armL:15,armR:-15});
  s+=xMark(240,600,t-2.0)+tag(150,560,'ไม่แก้เอง',t-2.0,{bg:'#fff',col:'#e6242b',fs:16});
  s+=xMark(240,660,t-3.4)+tag(150,700,'ไม่เดินหนี',t-3.4,{bg:'#fff',col:'#e6242b',fs:16,rot:4});
  const lx=lerp(600,400,easeOut(prog(t,3.6,5.2)));
