<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:K;src:url(../fonts/Kanit-Bold.ttf);font-weight:700}
@font-face{font-family:K;src:url(../fonts/Kanit-Black.ttf);font-weight:900}
@font-face{font-family:K;src:url(../fonts/Kanit-SemiBold.ttf);font-weight:600}
@font-face{font-family:K;src:url(../fonts/Kanit-Medium.ttf);font-weight:500}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
svg{display:block;font-family:K} text{font-family:K}
</style></head>
<body>
<svg id="v" width="540" height="960" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="../lib.js"></script>
<script>
window.EXTRA_DEFS=`<defs>
<linearGradient id="noon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4aa8f0"/><stop offset=".6" stop-color="#a9dbff"/><stop offset="1" stop-color="#fff1c9"/></linearGradient>
<radialGradient id="sunGlow2"><stop offset="0" stop-color="#fffbe0" stop-opacity="1"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient>
<filter id="sepia"><feColorMatrix type="matrix" values=".39 .77 .19 0 0  .35 .69 .17 0 0  .27 .53 .13 0 0  0 0 0 1 0"/></filter>
</defs>`;

const TIP={x:200,y:240};
function hang(L,a=0){return {hx:TIP.x+Math.sin(a)*L, hy:TIP.y+Math.cos(a)*L};}
function load(L,a,o={}){
  const {hx,hy}=hang(L,a); const rot=(o.rot!=null?o.rot:a*30);
  let s=`<line x1="${TIP.x}" y1="${TIP.y}" x2="${hx}" y2="${hy}" stroke="#2a2a2a" stroke-width="2.5"/>`;
  s+=`<g transform="translate(${hx} ${hy}) rotate(${rot})"><rect x="-9" y="0" width="18" height="12" rx="3" fill="#f2b51d" stroke="#8a6200"/><path d="M0 12 v6 q0 7 -7 5" stroke="#333" stroke-width="3" fill="none"/>
    <line x1="0" y1="20" x2="-80" y2="46" stroke="#4a4a4a" stroke-width="2"/><line x1="0" y1="20" x2="80" y2="46" stroke="#4a4a4a" stroke-width="2"/>
    <g transform="translate(0 52)"><rect x="-100" y="-8" width="200" height="6" fill="#8e4a2a"/><rect x="-100" y="8" width="200" height="6" fill="#8e4a2a"/><rect x="-100" y="-4" width="200" height="14" fill="#b0603a"/><rect x="-100" y="-4" width="200" height="3" fill="#fff" opacity=".25"/></g></g>`;
  return s;
}
function beamPos(L,a){const {hx,hy}=hang(L,a);return {x:hx,y:hy+52};}

function yardBg(t,o={}){
  const dark=o.dark||0;
  let s=`<rect width="540" height="960" fill="url(#noon)"/>`;
  s+=`<circle cx="430" cy="140" r="120" fill="url(#sunGlow2)"/><circle cx="430" cy="140" r="34" fill="#fffbe6"/>`;
  [[90,190,1],[300,250,.7]].forEach(([x,y,k],i)=>{const dx=(t*8+i*50)%80;s+=`<g transform="translate(${x+dx} ${y}) scale(${k})" fill="#fff" opacity=".9"><ellipse rx="50" ry="17"/><ellipse cx="-28" cy="5" rx="30" ry="13"/><ellipse cx="30" cy="5" rx="30" ry="13"/></g>`;});
  // hills + far shed
  s+=`<path d="M0 560 Q90 500 180 540 T360 530 T540 545 V700 H0 Z" fill="#8cc79a"/><path d="M0 590 Q120 560 240 585 T540 580 V700 H0 Z" fill="#76b487"/>`;
  s+=`<rect x="20" y="520" width="150" height="90" fill="#a9b8c8"/><path d="M10 524 L95 490 L180 524" fill="#2f4d7a"/>`;
  // crane truck
  s+=`<g>
    <rect x="330" y="690" width="210" height="10" fill="#555"/>
    <rect x="360" y="610" width="180" height="62" rx="6" fill="#f2b51d" stroke="#8a6200" stroke-width="2"/>
    <rect x="470" y="580" width="60" height="44" rx="6" fill="#f7f7f2" stroke="#888" stroke-width="2"/><rect x="480" y="588" width="40" height="22" rx="3" fill="#9fd6f5"/>
    ${[390,440,500].map(x=>`<circle cx="${x}" cy="680" r="18" fill="#222"/><circle cx="${x}" cy="680" r="7" fill="#999"/>`).join('')}
    <rect x="340" y="664" width="20" height="10" fill="#666"/><rect x="335" y="674" width="8" height="26" fill="#666"/><rect x="326" y="696" width="26" height="6" fill="#444"/>
    <circle cx="430" cy="610" r="16" fill="#d99b10"/>
  </g>`;
  // boom
  s+=`<g><path d="M440 616 L${TIP.x+8} ${TIP.y-6} L${TIP.x-2} ${TIP.y+8} L420 626 Z" fill="#f2b51d" stroke="#8a6200" stroke-width="2"/>
     <path d="M415 624 L350 520" stroke="#6b6b6b" stroke-width="8"/>
     ${[0,1,2,3,4,5].map(i=>{const u=i/6;const x=lerp(430,TIP.x,u),y=lerp(620,TIP.y,u);return `<line x1="${x}" y1="${y}" x2="${x+8}" y2="${y+10}" stroke="#8a6200" stroke-width="2"/>`}).join('')}
     <circle cx="${TIP.x}" cy="${TIP.y}" r="7" fill="#333"/></g>`;
  // steel stacks
  s+=`<g>${[0,1,2].map(i=>`<rect x="${30}" y="${676-i*14}" width="140" height="12" fill="${i%2?'#9b4a2c':'#b0603a'}" stroke="#5a2412"/>`).join('')}
     <rect x="40" y="690" width="10" height="10" fill="#7a5a3a"/><rect x="150" y="690" width="10" height="10" fill="#7a5a3a"/></g>`;
  s+=`<g>${[0,1,2,3].map(i=>`<rect x="${250}" y="${690-i*7}" width="90" height="6" fill="#8c96a3" stroke="#4d5560"/>`).join('')}</g>`;
  // ground gravel
  s+=`<rect x="0" y="700" width="540" height="260" fill="#cdb489"/><rect x="0" y="700" width="540" height="8" fill="#dcc79f"/>`;
  for(let i=0;i<40;i++) s+=`<circle cx="${rnd(i+3)*540}" cy="${712+rnd(i+11)*240}" r="${1+rnd(i)*2.5}" fill="#9c845c" opacity=".6"/>`;
  s+=`<path d="M0 820 Q270 790 540 830" stroke="#b39a70" stroke-width="18" fill="none" opacity=".5"/>`;
  // heat shimmer
  if(!dark) for(let i=0;i<5;i++){const y=640+i*14;s+=`<path d="M0 ${y} ${Array.from({length:14},(_,k)=>`Q${k*40+20} ${y+Math.sin(t*5+k+i)*3} ${k*40+40} ${y}`).join(' ')}" stroke="#fff" stroke-width="1.5" fill="none" opacity=".18"/>`;}
  if(dark) s+=`<rect width="540" height="960" fill="#6b4a2a" opacity="${.35*dark}"/>`;
  return s;
}
function dust(t,op){let s='';for(let i=0;i<30;i++){const x=((t*300+rnd(i)*800)%700)-80, y=420+rnd(i+5)*380+Math.sin(t*3+i)*12;
  s+=`<circle cx="${x}" cy="${y}" r="${2+rnd(i+9)*4}" fill="#e7cfa0" opacity="${op*(.3+rnd(i+2)*.5)}"/>`;}return s;}

const RIG={shirt:'#c0682b',pants:'#3b5a8a',skin:'#d39a68',hair:'#1f1a16',amulet:9,takrut:true};
function rigger(o){return person(Object.assign({},RIG,o));}
const PAL={shirt:'#2e9d6b',pants:'#2d3b6b',skin:'#e7b98a',hair:'#3a2a1a',helmet:true,chin:true,vest:true,gloves:true,boots:true};
function pal(o){return person(Object.assign({},PAL,o));}
const CHIP0='ผีเฝ้าไซต์ EP.3';
const BEAM_REST={L:385,a:0};

// ---------- scenes ----------
SC[1]=(t,d)=>{
  let s=yardBg(t)+load(385,0);
  const w=prog(t,0,3.4), x=lerp(-60,250,easeOut(w));
  s+=rigger({x,walk:t*1.4,walkAmt:w<1?1:0,armL:w<1?Math.sin(t*9)*20:15,armR:w<1?-Math.sin(t*9)*20:-15,mouth:'grin',eyes:'normal'});
  s+=`<rect width="540" height="960" fill="url(#vig)" opacity=".4"/>`+'<!--UI-->';
  const a=prog(t,.2,.7), b=prog(t,1.8,2.2);
  s+=`<text x="270" y="${150-10*(1-a)}" opacity="${a}" text-anchor="middle" font-size="32" font-weight="700" fill="#fff" paint-order="stroke" stroke="#1f4a7a" stroke-width="6">บ่ายสองโมง ลานกองเหล็ก...</text>`;
  s+=`<g transform="translate(270 230) scale(${back(b)}) rotate(-3)"><text text-anchor="middle" font-size="64" font-weight="900" fill="#ffd23f" paint-order="stroke" stroke="#1b1b1b" stroke-width="10">ช่างสายมู!</text></g>`;
  const c=prog(t,3.4,3.8);
  s+=`<g transform="translate(270 840) scale(${back(c)})" filter="url(#shadow)"><rect x="-140" y="-40" width="280" height="80" rx="10" fill="#b0603a" stroke="#fff" stroke-width="4"/>
     <text y="2" text-anchor="middle" font-size="28" font-weight="900" fill="#fff">ลานกองเหล็ก</text>
     <text y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#ffe9d6">งานยก • กลางแจ้ง • บ่ายสอง</text></g>`;
  return s+topUI(CHIP0);
};

SC[2]=(t,d)=>{
  const z=lerp(1,2.3,ease(prog(t,0,1.2))), cy=lerp(600,575,ease(prog(t,0,1.2)));
  let s=`<g transform="translate(270 ${cy}) scale(${z}) translate(-250 -585)">`+yardBg(t)+load(385,0)+rigger({x:250,mouth:'grin',eyes:'closed',glowAm:t,armL:30,armR:-30})+`</g>`;
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2+t*1.5;s+=`<path transform="translate(${270+Math.cos(a)*120} ${560+Math.sin(a)*70}) scale(${.8+.3*Math.sin(t*5+i)})" d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5 Z" fill="#fff36b" opacity="${prog(t,1,1.3)}"/>`;}
  s+='<!--UI-->';
  s+=tag(140,470,'พระ 9 องค์',t-1.3,{fs:20,rot:-6});
  s+=tag(400,760,'ตะกรุดเต็มเอว',t-2.0,{fs:20,rot:5});
  s+=`<g opacity="${prog(t,3.3,3.5)}">`+xMark(270,330,t-3.3)+tag(270,380,'หมวกนิรภัย: ไม่มี!',t-3.4,{fs:20,bg:'#fff',col:'#e6242b',rot:-3})+`</g>`;
  return s+titleCard(['พระเต็มคอ ตะกรุดเต็มเอว','แต่*ไม่มีหมวก*สักใบ'],t)+topUI('ครบชุด!');
};

SC[3]=(t,d)=>{
  let s=yardBg(t)+load(385,0);
  const off=prog(t,.2,.8);
  s+=pal({x:lerp(470,400,off),flip:-1,armR:lerp(-20,-80,off),mouth:'smile'});
  s+=helmetShape(lerp(470,400,off)-56,lerp(640,600,off),.8,'#ffcc1f',-10);
  const wv=t>2?Math.sin(t*14)*30:0;
  s+=rigger({x:250,eyes:'closed',mouth:'grin',armR:t>2?-150+wv:-20,lean:-3});
  s+=bubble(250,400,['มี*พระ*คุ้มครองแล้ว','ไม่ต้องหรอก!'],t-2.4);
  return s+'<!--UI-->'+titleCard(['ข้ออ้างยอดฮิต','"มี*พระคุ้มครอง*แล้ว"'],t)+topUI('ข้ออ้าง');
};

SC[4]=(t,d)=>{
  const up=ease(prog(t,.3,2.8)); const L=lerp(385,190,up);
  let s=yardBg(t);
  s+=load(L,Math.sin(t*2)*.01);
  const w=prog(t,2.4,3.6), x=lerp(330,215,easeOut(w));
  s+=rigger({x,walk:t*1.4,walkAmt:w>0&&w<1?1:0,armR:t>3.6?-160:-20,armL:20,eyes:'normal',mouth:'smile'});
  s+=xMark(215,470,t-4.0)+tag(330,460,'ยืนใต้ของ!',t-4.0,{bg:'#fff',col:'#e6242b'});
  s+=xMark(120,560,t-4.8)+tag(120,600,'ใช้มือจับคาน!',t-4.8,{bg:'#fff',col:'#e6242b',rot:4});
  return s+'<!--UI-->'+titleCard(['รถเครนยกคานขึ้น...','แต่เขากลับยืน*ใต้ของ!*'],t)+topUI('อันตราย!');
};

SC[5]=(t,d)=>{
  const dk=prog(t,.3,1.5);
  let s=yardBg(t,{dark:dk});
  s+=load(190,Math.sin(t*3)*.05*dk);
  s+=dust(t,dk)+windLines(t,.7*dk);
  s+=rigger({x:215,armR:-160,eyes:'wide',mouth:'o',glowAm:t*dk,lean:Math.sin(t*15)*2});
  s+=burst(400,470,'กริ๊ก กริ๊ก!',t-2.8,{fill:'#fff3a0',col:'#b8860b',fs:32,rot:8,sc:.8});
  return s+`<rect width="540" height="960" fill="url(#vig)" opacity="${dk}"/>`+'<!--UI-->'+titleCard(['ทันใดนั้น...','*ลมกรรโชก*พัดมา!'],t)+topUI('วูบบบ...');
};

SC[6]=(t,d)=>{
  let s=yardBg(t,{dark:1})+load(190,Math.sin(t*3)*.05)+dust(t,.6);
  s+=ghost(110,700,prog(t,.1,.9),t,{amulet:true,armR:-40,eyes:'normal',mouth:'smile'});
  s+=rigger({x:280,eyes:'wide',mouth:'o',sweat:1,glowAm:t,flip:-1});
  s+=bubble(170,390,['ลุงก็*ห้อยพระ*','เหมือนกันนะ...'],t-1.4);
  return s+`<rect width="540" height="960" fill="url(#vig)"/>`+'<!--UI-->'+titleCard(['*ลุงช่าง*โผล่มา...'],t,34)+topUI('ลุงช่างมาแล้ว');
};

SC[7]=(t,d)=>{
  let s=`<g filter="url(#sepia)">`+yardBg(t,{dark:1})+`</g>`;
  s+=`<rect width="540" height="960" fill="#1a1222" opacity=".45"/>`;
  const sh=prog(t,.6,1.6);
  s+=`<g opacity="${.7*sh}">${helmetShape(380,700,1.1,'#bfa45a',8)}</g>`;
  s+=ghost(200,700,1,t,{amulet:true,armR:-15,armL:15,eyes:'closed',mouth:'flat'});
  s+=`<g opacity="${prog(t,.3,.9)}"><text x="270" y="420" text-anchor="middle" font-size="28" font-weight="700" fill="#fff" paint-order="stroke" stroke="#1a1222" stroke-width="6">"แต่วันที่ลุงไม่ใส่หมวก...</text></g>`;
  s+=`<g opacity="${prog(t,1.8,2.4)}"><text x="270" y="465" text-anchor="middle" font-size="34" font-weight="900" fill="#ffd23f" paint-order="stroke" stroke="#1a1222" stroke-width="6">ลุงไม่ได้กลับบ้าน"</text></g>`;
  return s+`<rect width="540" height="960" fill="url(#vig)"/>`+'<!--UI-->'+topUI('ความจริง...');
};

const T8={swing:1.4,shout:3.69,jump:3.85,crash:4.9};
function swing8(t){
  if(t<T8.swing) return {L:190,a:Math.sin(t*3)*.05,drop:0};
  if(t<T8.crash-.5){const u=t-T8.swing; return {L:190,a:Math.sin(u*3.2)*Math.min(.45,.12+u*.14),drop:0};}
  const p=prog(t,T8.crash-.5,T8.crash); return {L:lerp(190,400,p*p),a:lerp(Math.sin((T8.crash-.5-T8.swing)*3.2)*.45,0,p),drop:p};
}
SC[8]=(t,d)=>{
  const sw=swing8(t);
  const shake=t>T8.crash&&t<T8.crash+.4?Math.sin(t*90)*7:0;
  let s=`<g transform="translate(${shake} ${shake*.6})">`+yardBg(t,{dark:.8});
  s+=load(sw.L,sw.a,{rot:t>T8.crash?2:sw.a*30});
  s+=dust(t,.5);
  const j=prog(t,T8.jump,T8.jump+.35); const x=lerp(215,100,easeOut(j));
  s+=rigger({x,y:700-Math.sin(j*Math.PI)*50,eyes:'wide',mouth:'o',sweat:1,lean:-12*j,armL:j>0?150:20,armR:j>0?-150:-160});
  s+=ghost(430,700,.85,t,{amulet:true,armR:-120,eyes:'wide',mouth:'grin',flip:-1});
  s+=`</g>`;
  s+=burst(400,400,'ถอยออกมา!',t-T8.shout,{fs:38,fill:'#d9f3ff',col:'#e6242b',rot:6,sc:.85});
  s+=burst(220,770,'โครม!!',t-T8.crash,{fs:50,col:'#ffd23f',rot:-6});
  if(t>T8.crash) s+=`<rect width="540" height="960" fill="#fff" opacity="${clamp(1-(t-T8.crash)/.12)*.7}"/>`;
  return s+'<!--UI-->'+titleCard(['*สลิงแกว่ง!*'],t,34)+topUI('ถอย!!');
};

SC[9]=(t,d)=>{
  let s=yardBg(t,{dark:.4*(1-prog(t,0,3))});
  s+=`<line x1="${TIP.x}" y1="${TIP.y}" x2="200" y2="640" stroke="#2a2a2a" stroke-width="2.5"/>`;
  s+=`<g transform="translate(210 690)"><rect x="-100" y="-8" width="200" height="6" fill="#8e4a2a"/><rect x="-100" y="8" width="200" height="6" fill="#8e4a2a"/><rect x="-100" y="-4" width="200" height="14" fill="#b0603a"/></g>`;
  s+=`<ellipse cx="210" cy="700" rx="${110}" ry="10" fill="#000" opacity=".2"/>`;
  s+=rigger({x:105,sit:1,eyes:'wide',mouth:'o',sweat:1,armL:60,armR:-60});
  s+=`<path d="M215 520 v80" stroke="#e6242b" stroke-width="5" stroke-dasharray="8 6" opacity="${prog(t,.6,1)}"/>`;
  s+=tag(330,500,'ตรงที่เพิ่งยืน!',t-.8,{bg:'#fff',col:'#e6242b',rot:4});
  return s+'<!--UI-->'+titleCard(['"เกือบไปแล้ว..."'],t,34)+topUI('รอดหวุดหวิด');
};

const T10={helmet:1.97,gloves:2.95,boots:3.65,vest:5.22,rope:6.58,done:7.9};
SC[10]=(t,d)=>{
  let s=yardBg(t)+load(385,0);
  const has=k=>t>=T10[k];
  s+=rigger({x:300,helmet:has('helmet'),chin:has('helmet'),gloves:has('gloves'),boots:has('boots'),vest:has('vest'),eyes:t>T10.done?'closed':'normal',mouth:'grin',
    armR:t>T10.done?-150:-20,thumb:t>T10.done,armL:has('rope')?40:20});
  if(has('rope')) s+=`<g transform="translate(262 592)">${ppeIcon('rope',0,0,0)}</g><g transform="translate(258 600)" fill="none" stroke="#e8c27a" stroke-width="4"><ellipse rx="14" ry="9"/><ellipse rx="8" ry="5"/></g>`;
  const ks=['helmet','gloves','boots','vest','rope'];
  ks.forEach((k,i)=>{const tt=t-T10[k];if(tt>=0)s+=sparkles(300,[515,620,700,600,600][i],tt,8,45);});
  let ui=''; const uo=prog(t,1.4,1.7);
  ui+=`<g transform="translate(20 420)" filter="url(#shadow)" opacity="${uo}"><rect width="190" height="246" rx="12" fill="#fff" stroke="#1b1b1b" stroke-width="3"/></g>`;
  const names={helmet:'หมวก+รัดคาง',gloves:'ถุงมือ',boots:'รองเท้าเซฟตี้',vest:'เสื้อสะท้อนแสง',rope:'เชือกนำทาง'};
  if(uo>0) ks.forEach((k,i)=>{const on=has(k);
    ui+=`<g transform="translate(46 ${458+i*44})" opacity="${uo}"><rect x="-14" y="-14" width="28" height="28" rx="6" fill="${on?'#1fb35a':'#ddd'}"/>${on?'<path d="M-7 0 L-2 6 L8 -6" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>':''}
      <text x="24" y="8" font-size="18" font-weight="700" fill="#1b1b1b">${names[k]}</text></g>`;});
  if(t>T10.done){s+=sparkles(300,560,t-T10.done,12,110);s+=burst(300,830,'ครบทุกชิ้น!',t-T10.done,{fill:'#8df07a',col:'#fff',fs:40,rot:-5,sc:.85});}
  const cnt=ks.filter(has).length;
  return s+'<!--UI-->'+ui+titleCard(['คราวนี้ใส่ *PPE*','ให้ครบ ให้ถูก!'],t)+topUI(cnt?`ชิ้นที่ ${cnt}/5`:'เริ่มใหม่');
};

SC[11]=(t,d)=>{
  let s=yardBg(t);
  const r=prog(t,.2,.8);
  s+=`<ellipse cx="215" cy="712" rx="${100*r}" ry="${22*r}" fill="#e6242b" fill-opacity=".18" stroke="#e6242b" stroke-width="4" stroke-dasharray="12 8"/>`;
  const a=Math.sin(t*1.5)*.06;
  s+=load(200,a);
  const bp=beamPos(200,a);
  const ex=bp.x-95*Math.cos(a*30*Math.PI/180), ey=bp.y+4-95*Math.sin(a*30*Math.PI/180);
  s+=`<path d="M${ex} ${ey} Q${(ex+80)/2} ${ey+120} 80 600" stroke="#e8c27a" stroke-width="3" fill="none"/>`;
  s+=rigger({x:70,helmet:true,chin:true,gloves:true,boots:true,vest:true,armR:-60,mouth:'smile'});
  s+=pal({x:420,flip:-1,armR:-160,mouth:'smile'});
  s+=check(215,800,t-1.2)+tag(215,850,'ไม่เข้าใต้ของ',t-1.3,{fs:18,bg:'#8df07a',rot:-3});
